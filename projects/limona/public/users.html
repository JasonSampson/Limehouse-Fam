<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Limona — Users</title>
  <link rel="icon" type="image/png" href="/images/limona-avatar.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="admin-shell">
    <nav id="sidebar-root" class="sidebar"></nav>
    <div class="admin-content">
      <div id="error" class="error" style="display:none;"></div>

      <h1>Users</h1>
      <p class="muted">Invite staff members and manage their access to Limona.</p>

      <div class="card">
        <h2>Invite a staff member</h2>
        <label for="invite-email">Email</label>
        <input type="email" id="invite-email" />
        <label for="invite-name">Name</label>
        <input type="text" id="invite-name" />
        <button id="invite-button">Send invite</button>
        <div id="invite-result" class="muted" style="margin-top:10px;"></div>
      </div>

      <div class="card">
        <h2>Staff</h2>
        <table id="users-table">
          <thead>
            <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="/js/sidebar.js"></script>
  <script src="/js/users.js"></script>
</body>
</html>
