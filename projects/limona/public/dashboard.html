<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Limona — Dashboard</title>
  <link rel="icon" type="image/png" href="/images/limona-avatar.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="admin-shell">
    <nav id="sidebar-root" class="sidebar"></nav>
    <div class="admin-content">
      <div id="error" class="error" style="display:none;"></div>

      <h1>Dashboard</h1>
      <p class="muted">A quick look at Limona's knowledge base and team activity.</p>

      <div id="stat-cards" class="stat-cards">
        <div class="stat-card">
          <div class="stat-card-label">Documents</div>
          <div class="stat-card-value" id="stat-documents">—</div>
          <div class="stat-card-sub">Uploaded to the knowledge base</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Knowledge Gaps</div>
          <div class="stat-card-value" id="stat-gaps">—</div>
          <div class="stat-card-sub">Questions with no document match</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Questions Asked</div>
          <div class="stat-card-value" id="stat-questions">—</div>
          <div class="stat-card-sub">Total asked to date</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Team Members</div>
          <div class="stat-card-value" id="stat-team">—</div>
          <div class="stat-card-sub" id="stat-team-sub">&nbsp;</div>
        </div>
      </div>

      <div class="card">
        <h2>Quick Actions</h2>
        <div class="quick-actions">
          <a class="button-link" href="/admin.html">Upload a Document</a>
          <a class="button-link" href="/users.html">Invite a Teammate</a>
          <a class="button-link" href="/reporting.html">View Knowledge Gaps</a>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/sidebar.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
