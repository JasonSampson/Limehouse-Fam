<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Limona — Assets</title>
  <link rel="icon" type="image/png" href="/images/limona-avatar.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="admin-shell">
    <nav id="sidebar-root" class="sidebar"></nav>
    <div class="admin-content">
      <div id="error" class="error" style="display:none;"></div>

      <h1>Assets</h1>
      <p class="muted">Brand and reference files — logos, templates, calculators, and other files that aren't searched by chat. Just stored here for the team to find and download.</p>

      <div class="card" id="upload-asset-card">
        <h2>Upload an Asset</h2>
        <label for="upload-description">Description</label>
        <input type="text" id="upload-description" placeholder="e.g. Limehouse Plan pricing calculator" />
        <label for="upload-category">Category</label>
        <input type="text" id="upload-category" list="category-suggestions" placeholder="e.g. Marketing" />
        <datalist id="category-suggestions">
          <option value="Company Docs"></option>
          <option value="Calculators"></option>
          <option value="PMA's"></option>
          <option value="Lease Docs"></option>
          <option value="Vendor"></option>
          <option value="Marketing"></option>
        </datalist>
        <label>File</label>
        <div class="dropzone" id="upload-dropzone" tabindex="0" role="button" aria-label="Click to choose a file or drag and drop">
          <span class="dropzone-text">Click to choose a file or drag &amp; drop</span>
          <span class="dropzone-filenames" id="upload-dropzone-filenames"></span>
        </div>
        <input type="file" id="upload-file" class="visually-hidden" />
        <button id="upload-button">Upload</button>
        <div id="upload-status" class="muted" style="margin-top:10px;"></div>
      </div>

      <h2>Asset Library</h2>
      <datalist id="asset-category-datalist"></datalist>
      <div id="assets-container"></div>
    </div>
  </div>
  <script src="/js/sidebar.js"></script>
  <script src="/js/dropzone.js"></script>
  <script src="/js/assets.js"></script>
</body>
</html>
