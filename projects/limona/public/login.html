<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Limona — Log in</title>
  <link rel="icon" type="image/png" href="/images/limona-avatar.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page narrow">
    <div class="card" style="margin-top: 60px; text-align: center;">
      <img src="/images/limona-avatar.png" alt="Limona" width="72" height="72" style="border-radius: 50%; margin-bottom: 12px;" />
      <h1>Limona</h1>
      <p class="muted">Limehouse Property Management staff knowledge base</p>
      <div id="error" class="error" style="display:none;"></div>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required />
        <label for="password">Password</label>
        <input type="password" id="password" required />
        <button type="submit">Log in</button>
      </form>
    </div>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
