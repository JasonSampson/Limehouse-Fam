<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Limona — Accept invite</title>
  <link rel="icon" type="image/png" href="/images/limona-avatar.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page narrow">
    <div class="card" style="margin-top: 60px;">
      <h1>Welcome to Limona</h1>
      <p class="muted" id="invite-email">Loading invite...</p>
      <div id="error" class="error" style="display:none;"></div>
      <form id="accept-form" style="display:none;">
        <label for="name">Your name</label>
        <input type="text" id="name" required />
        <label for="password">Choose a password (8+ characters)</label>
        <input type="password" id="password" minlength="8" required />
        <button type="submit">Set password and continue</button>
      </form>
    </div>
  </div>
  <script src="/js/accept-invite.js"></script>
</body>
</html>
