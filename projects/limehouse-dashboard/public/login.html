<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Limehouse PM — Sign In</title>
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <main>
    <div class="login-card">
      <div class="app-brand" style="justify-content:center;margin-bottom:20px;">
        <img class="app-brand-logo app-brand-logo--lg" src="/images/limehouse-logo.png" alt="Limehouse Property Management" />
      </div>
      <h2 style="text-align:center;margin:0 0 20px;">Staff Sign In</h2>
      <a href="/auth/login" class="microsoft-signin-btn" id="ms-signin-btn">
        <svg width="18" height="18" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
          <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
          <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
        </svg>
        Sign in with Microsoft
      </a>
      <p class="login-note" id="login-error"></p>
    </div>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
